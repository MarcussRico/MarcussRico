name: Redraw the 3D contribution graph

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.*
      - name: Draw assets/contrib3d.svg from the live calendar
        run: python tools/contrib3d.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          if git diff --quiet assets/contrib3d.svg; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib3d.svg
          git commit -m "Redraw the 3D contribution graph"
          git push
